name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        cache-dependency-path: |
          android/**/*.gradle*
          android/gradle/libs.versions.toml
          android/gradle/wrapper/gradle-wrapper.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode google-services.json (if configured)
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -n "$GOOGLE_SERVICES_JSON" ]; then
          trimmed="$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]')"
          case "$trimmed" in
            \{*) printf '%s' "$GOOGLE_SERVICES_JSON" > /tmp/gs_secret.json ;;
            *) printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > /tmp/gs_secret.json ;;
          esac
          if [ ! -f app/google-services.json ] || grep -q 'com.kangekie.konvoitouring' /tmp/gs_secret.json; then
            mv /tmp/gs_secret.json app/google-services.json
          else
            echo "Keeping repository app/google-services.json because GOOGLE_SERVICES_JSON secret targets a different package."
            rm -f /tmp/gs_secret.json
          fi
        fi
        if [ -f app/google-services.json ]; then
          echo "Detected app/google-services.json packages:"
          grep -oE '"package_name"[[:space:]]*:[[:space:]]*"[^"]+"' app/google-services.json || echo "(no package_name field found)"
        fi

    - name: Build Debug APK
      env:
        TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY || secrets.MAPS_API_KEY || 'fxxBdOwiITup2btha0dFUl6IOxczJm4f' }}
      run: ./gradlew assembleDebug --no-daemon

    - name: Print APK Signing SHA-1 & SHA-256
      run: |
        if [ -f app/debug.keystore ]; then
          keytool -list -v -keystore app/debug.keystore -alias androiddebugkey -storepass android | grep -E "SHA1:|SHA256:" || true
        fi
        ./gradlew signingReport --no-daemon | grep -E "Variant:|SHA1:|SHA-256:" | head -n 12 || true

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
