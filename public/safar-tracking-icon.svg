<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#032217" />
      <stop offset="55%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.28" />
      <stop offset="65%" stop-color="#059669" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>
  </defs>

  <!-- Emerald Rounded Square Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="url(#goldGlow)" />

  <!-- Subtle Gold Radar Tracking Rings -->
  <circle cx="256" cy="232" r="196" fill="none" stroke="#FCD34D" stroke-opacity="0.18" stroke-width="4" stroke-dasharray="16 14" />
  <circle cx="256" cy="232" r="150" fill="none" stroke="#6EE7B7" stroke-opacity="0.22" stroke-width="3" />

  <!-- GPS Tracking Route Arc at Bottom -->
  <path
    d="M 88 396 C 144 358, 200 412, 256 412 C 312 412, 368 358, 424 396"
    fill="none"
    stroke="#FCD34D"
    stroke-opacity="0.6"
    stroke-width="10"
    stroke-linecap="round"
    stroke-dasharray="16 16"
  />
  <circle cx="256" cy="414" r="12" fill="#34D399" stroke="#ECFDF5" stroke-width="4" />

  <!-- GPS Location Pin -->
  <path
    d="M 256 76 C 173 76 106 143 106 226 C 106 312 228 386 248 402 C 253 406 259 406 264 402 C 284 386 406 312 406 226 C 406 143 339 76 256 76 Z"
    fill="url(#pinGrad)"
  />

  <!-- Inner Emerald Medallion -->
  <circle cx="256" cy="220" r="110" fill="#064E3B" stroke="#10B981" stroke-width="5" />

  <!-- Ka'bah Emblem Centered Inside Pin -->
  <!-- Subtle Gold Aura -->
  <circle cx="256" cy="220" r="82" fill="#F59E0B" fill-opacity="0.14" />
  <!-- Ka'bah Black Cube Body -->
  <rect x="196" y="164" width="120" height="114" rx="10" fill="#0F172A" stroke="#FCD34D" stroke-width="3" />
  <!-- Kiswah Gold Band (Hizam) -->
  <rect x="196" y="186" width="120" height="15" fill="#F59E0B" />
  <rect x="196" y="189" width="120" height="4" fill="#FDE68A" />
  <!-- Ka'bah Gold Door (Bab al-Ka'bah) -->
  <rect x="242" y="220" width="28" height="44" rx="4" fill="#F59E0B" stroke="#FEF3C7" stroke-width="2" />
  <!-- Gold Corner Accents -->
  <rect x="208" y="214" width="14" height="5" rx="2" fill="#FCD34D" fill-opacity="0.7" />
  <rect x="290" y="214" width="14" height="5" rx="2" fill="#FCD34D" fill-opacity="0.7" />
</svg>
